name: default
version: "1.0.0"
fields:
  - name: vendor_name
    type: text
    position: first_line
  - name: invoice_number
    type: identifier
    labels: ["invoice number", "invoice no", "invoice #", "inv no", "invoice"]
  - name: invoice_date
    type: date
    labels: ["invoice date", "date"]
  - name: currency
    type: currency
    labels: ["currency"]
    scan: true
  - name: subtotal
    type: amount
    labels: ["subtotal", "sub total", "net amount"]
    take: last
  - name: tax_amount
    type: amount
    labels: ["tax amount", "tax", "vat", "gst", "ppn", "pb1"]
    take: last
  - name: total_amount
    type: amount
    labels: ["grand total", "total due", "amount due", "total"]
    take: last
line_items:
  header_labels: ["description", "item", "qty"]
  end_labels: ["subtotal", "sub total", "tax", "vat", "total"]
