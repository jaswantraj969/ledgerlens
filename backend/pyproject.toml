[project]
name = "ledgerlens"
version = "0.1.0"
description = "Evaluation-driven document extraction for invoices and receipts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10.4",
    "prometheus-client>=0.20",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "pypdfium2>=4.30",
    "python-dateutil>=2.9",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "redis>=5.0",
    "rq>=1.16",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0.30",
    "structlog>=24.4",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
ocr = ["onnxruntime>=1.18", "rapidocr>=3.0"]
docling = ["docling>=2.5"]
llm = ["litellm>=1.48"]
eval = ["faker>=28", "matplotlib>=3.9", "pandas>=2.2", "pyarrow>=17", "reportlab>=4.2"]

[dependency-groups]
dev = [
    "hypothesis>=3",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-python-dateutil",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs real PostgreSQL and Redis",
    "e2e: runs the whole pipeline",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["ledgerlens"]

[[tool.mypy.overrides]]
module = ["pypdfium2.*"]
ignore_missing_imports = true
