repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=1024"]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
  # Local hooks use the locked versions, so pre-commit and CI cannot disagree.
  # --no-sync keeps hooks offline; run `uv sync` yourself when dependencies change.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --no-sync --directory backend ruff check . ../evals --config pyproject.toml
        language: system
        pass_filenames: false
        files: ^(backend|evals)/
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync --directory backend ruff format --check . ../evals --config pyproject.toml
        language: system
        pass_filenames: false
        files: ^(backend|evals)/
      - id: mypy
        name: mypy
        entry: uv run --no-sync --directory backend mypy
        language: system
        pass_filenames: false
        files: ^(backend|evals)/
